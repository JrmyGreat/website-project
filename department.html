<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shop | Jeremy Clothing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jeremy">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body data-page="department">
  <header id="site-header"></header>

  <main>
    <section class="page-hero" id="dept-hero">
      <div>
        <p class="eyebrow fade-up d1" style="color:var(--beige)">The Collection</p>
        <h1 class="fade-up d2" id="dept-name">Department</h1>
        <p class="fade-up d3" id="dept-tagline"></p>
      </div>
    </section>

    <div class="container">
      <nav class="dept-tabs">
        <a href="department.html?d=women">Women</a>
        <a href="department.html?d=men">Men</a>
        <a href="department.html?d=child">Child</a>
        <a href="department.html?d=toys">Toys</a>
        <a href="department.html?d=adult">Adult</a>
      </nav>
      <div class="toolbar">
        <span id="count"></span>
        <label>Sort&nbsp;
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>
        </label>
      </div>
      <div class="grid" id="product-grid"></div>
    </div>
    <div class="section"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const d = new URLSearchParams(location.search).get("d") || "women";
    document.querySelectorAll(".dept-tabs a").forEach(a => a.classList.toggle("active", a.href.endsWith("d=" + d)));
  </script>
</body>
</html>
